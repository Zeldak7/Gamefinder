<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Security-Policy" content="
      default-src 'self' data: https://ssl.gstatic.com 'unsafe-eval';
      connect-src 'self' https://api.rawg.io;
      img-src 'self' data: https://media.rawg.io;
      style-src 'self' 'unsafe-inline';
    ">
    <meta name="viewport" content="initial-scale=1, width=device-width, viewport-fit=cover">
    <title>PC Games - GameFinder</title>
    <link rel="stylesheet" href="css/index.css">
    <button id="back-button" class="back-button ">Back</button>
    <style>
        /* Global Styles */
        body {
          font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
          background: linear-gradient(135deg, #1c1c1c, #434343);
          color: #fff;
          margin: 0;
          padding: 0;
        }
        
        /* Container styling */
        .container {
          max-width: 800px;
          margin: 50px auto;
          background: rgba(255, 255, 255, 0.1);
          padding: 30px;
          border-radius: 10px;
          box-shadow: 0 8px 16px rgba(0, 0, 0, 0.5);
        }
        
        /* Page Header */
        h1 {
          font-size: 3em;
          text-align: center;
          margin-bottom: 20px;
          text-transform: uppercase;
          letter-spacing: 2px;
        }
        
        /* Game Info Section */
        #game-info {
          margin: 20px 0;
        }
        .game-title {
          font-size: 2em;
          margin-bottom: 10px;
          text-shadow: 2px 2px 4px rgba(0,0,0,0.7);
        }
        
        /* Image container for cropping the game image */
        .image-container {
          width: 100%;
          max-width: 600px;
          height: 300px;
          overflow: hidden;
          margin: 0 auto 20px;
          border-radius: 10px;
          box-shadow: 0 4px 8px rgba(0,0,0,0.3);
        }
        .image-container img {
          width: 100%;
          height: 100%;
          object-fit: cover;
          object-position: center;
        }
        
        /* Game Description */
        .game-description {
          font-size: 1.2em;
          line-height: 1.4em;
          margin-bottom: 20px;
        }
        
        /* Button Styles */
        .buttons {
          text-align: center;
          margin-top: 20px;
        }
        .buttons button {
          padding: 15px 30px;
          font-size: 1.2em;
          margin: 0 15px;
          cursor: pointer;
          border: none;
          border-radius: 30px;
          transition: background 0.3s, transform 0.2s;
        }
        .like-button {
          background: linear-gradient(45deg, #4CAF50, #2E7D32);
        }
        .dislike-button {
          background: linear-gradient(45deg, #f44336, #c62828);
        }
        .buttons button:hover {
          transform: translateY(-3px);
        }
        
        /* Responsive Styles */
        @media (max-width: 600px) {
          h1 {
            font-size: 2em;
          }
          .buttons button {
            padding: 10px 20px;
            font-size: 1em;
            margin: 10px;
          }
        }
      </style>
  </head>
  <body>
    <div class="container">
      <div id="game-info"></div>
      <div class="buttons">
        <button id="like-button" class="like-button">I played it</button>
        <button id="dislike-button" class="dislike-button">I haven't played it</button>
      </div>
      <div id="deviceready"></div>
    </div>
    <script src="cordova.js"></script>
    <script src="js/index.js"></script>
    <script src="js/pc.js"></script>
    <script src="js/backButton.js"></script>
  </body>
</html>
