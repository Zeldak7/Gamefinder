        <meta name="format-detection" content="telephone=no">

        <meta name="viewport" content="initial-scale=1, width=device-width, viewport-fit=cover">

        <link rel="stylesheet" href="css/index.css">
        <title>GameFinder</title>
    </head>
    <body>
        <div class="app">
            <h1>Welcome to GameFinder</h1>
            <p>Which platform are you using?</p>
            <div id="platform-options">
                <button id="xbox" onclick="selectPlatform('Xbox')">Xbox</button>
                <button id="playstation" onclick="selectPlatform('PlayStation')">PlayStation</button>
                <button id="pc" onclick="selectPlatform('PC')">PC</button>
                <button id="nintendo-switch" onclick="selectPlatform('Switch')">Switch</button>
            </div>
        </div>
        <script src="cordova.js"></script>
        <script src="js/index.js"></script>
        <script>
            // This function is called when any platform button is clicked.
            function selectPlatform(platform) {
                alert("You selected: " + platform);
                // Add additional logic here as needed.
            }
        </script>
    </body>
</html>
