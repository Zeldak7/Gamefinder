<html>
  <head>
    <meta charset="utf-8">

    <meta http-equiv="Content-Security-Policy" content="default-src 'self' data: https://ssl.gstatic.com 'unsafe-eval'; style-src 'self' 'unsafe-inline'; media-src *; img-src 'self' data: content:;">
    <meta name="format-detection" content="telephone=no">
    <meta name="msapplication-tap-highlight" content="no">
    <meta name="viewport" content="initial-scale=1, width=device-width, viewport-fit=cover">
    <meta name="color-scheme" content="light dark">
    <link rel="stylesheet" href="css/index.css">
    <title>GameFinder</title>
    <button id="back-button" class="back-button hide-back">Back</button>
  </head>
  <body>
    <!-- Add this element if index.js uses it -->
    <div id="deviceready" class="blink"></div>
    
    <div class="app">
    
      <h1>Welcome to GameFinder</h1>
      <p>Which platform are you using?</p>
      <div id="platform-options">
        <button id="xbox">Xbox</button>
        <button id="playstation">PlayStation</button>
        <button id="pc">PC</button>
        <button id="nintendo-switch">Switch</button>
      </div>
    </div>
    
    <!-- Cordova files: -->
    <script src="cordova.js"></script>
    <!-- index.js is usually generated by Cordova. It may try to update the "deviceready" element. -->
    <script src="js/index.js"></script>
    <!-- Our external app script (moved from inline) -->
    <script src="js/app.js"></script>
  </body>
</html>
